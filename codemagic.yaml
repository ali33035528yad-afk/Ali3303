workflows:
  beatnova-android:
    name: BeatNova Android Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    scripts:
      - name: Extract BeatNova project
        script: |
          set -e

          ZIP="$CM_BUILD_DIR/BeatNova-OnlinePlayer-Release-Codemagic-Fixed2.zip"

          echo "Looking for:"
          echo "$ZIP"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: ZIP file not found"
            echo "Files in repository:"
            find "$CM_BUILD_DIR" -maxdepth 2 -type f | sort
            exit 1
          fi

          rm -rf "$CM_BUILD_DIR/build_project"
          mkdir -p "$CM_BUILD_DIR/build_project"

          unzip -q "$ZIP" -d "$CM_BUILD_DIR/build_project"

          echo "ZIP extracted successfully"
          find "$CM_BUILD_DIR/build_project" -maxdepth 4 -type f | sort

      - name: Check Gradle project
        script: |
          set -e

          PROJECT_DIR="$CM_BUILD_DIR/build_project"

          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          echo "BeatNova project files are OK."

      - name: Set Android SDK
        script: |
          set -e

          PROJECT_DIR="$CM_BUILD_DIR/build_project"

          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$PROJECT_DIR/local.properties"

      - name: Install Gradle 8.9
        script: |
          set -e

          cd "$CM_BUILD_DIR"

          curl -L --fail \
            -o gradle.zip \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip

          unzip -q gradle.zip
          rm -f gradle.zip

      - name: Build BeatNova Release APK
        script: |
          set -e

          cd "$CM_BUILD_DIR/build_project"

          "$CM_BUILD_DIR/gradle-8.9/bin/gradle" \
            --no-daemon \
            --stacktrace \
            clean assembleRelease

    artifacts:
      - $CM_BUILD_DIR/build_project/app/build/outputs/apk/release/app-release.apk
