workflows:
  beatnova-android:
    name: BeatNova Android
    max_build_duration: 30

    environment:
      java: 17

    scripts:
      - name: Find and extract BeatNova ZIP
        script: |
          set -e

          echo "Searching for ZIP file..."

          ZIP_FILE=$(find . -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found!"
            echo "Files in repository:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"

          rm -rf build_project
          mkdir -p build_project

          unzip -q "$ZIP_FILE" -d build_project

          echo "Searching for Gradle project..."

          GRADLE_DIR=$(find build_project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit | xargs -r dirname)

          if [ -z "$GRADLE_DIR" ]; then
            echo "ERROR: Gradle project not found inside ZIP!"
            find build_project -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "Gradle project found at:"
          echo "$GRADLE_DIR"

          echo "$GRADLE_DIR" > /tmp/gradle_dir

      - name: Build BeatNova
        script: |
          set -e

          GRADLE_DIR=$(cat /tmp/gradle_dir)

          cd "$GRADLE_DIR"

          echo "Project directory:"
          pwd

          echo "Project files:"
          ls -la

          chmod +x gradlew

          ./gradlew clean assembleDebug --stacktrace

      - name: Prepare APK
        script: |
          set -e

          GRADLE_DIR=$(cat /tmp/gradle_dir)

          APK=$(find "$GRADLE_DIR/app/build/outputs/apk" \
            -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated!"
            find "$GRADLE_DIR/app/build/outputs" -type f 2>/dev/null || true
            exit 1
          fi

          mkdir -p artifacts

          cp "$APK" artifacts/BeatNova-debug.apk

          echo "APK created successfully:"
          ls -lh artifacts/BeatNova-debug.apk

    artifacts:
      - artifacts/*.apk
