workflows:
  beatnova-android:
    name: BeatNova Online Player Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    scripts:
      - name: Extract BeatNova ZIP
        script: |
          set -euo pipefail
          ZIP="$CM_BUILD_DIR/BeatNova-OnlinePlayer-Release-Codemagic-Fixed2.zip"
          BUILD_DIR="$CM_BUILD_DIR/build_project"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: ZIP not found: $ZIP"
            echo "Repository files:"
            find "$CM_BUILD_DIR" -maxdepth 2 -type f -print | sort
            exit 1
          fi

          rm -rf "$BUILD_DIR"
          mkdir -p "$BUILD_DIR"
          unzip -q "$ZIP" -d "$BUILD_DIR"

          echo "Extracted project:"
          find "$BUILD_DIR" -maxdepth 4 -type f -print | sort

      - name: Locate Gradle project
        script: |
          set -euo pipefail
          BUILD_DIR="$CM_BUILD_DIR/build_project"

          if [ -f "$BUILD_DIR/settings.gradle.kts" ]; then
            PROJECT_DIR="$BUILD_DIR"
          else
            PROJECT_DIR="$(find "$BUILD_DIR" -name settings.gradle.kts -type f -print -quit | xargs -r dirname)"
          fi

          if [ -z "${PROJECT_DIR:-}" ] || [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle.kts not found"
            find "$BUILD_DIR" -maxdepth 7 -type f -print | sort
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" > "$CM_BUILD_DIR/project.env"
          echo "Using PROJECT_DIR=$PROJECT_DIR"

      - name: Check BeatNova project
        script: |
          set -euo pipefail
          source "$CM_BUILD_DIR/project.env"
          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          echo "BeatNova project files OK."

      - name: Configure Android SDK
        script: |
          set -euo pipefail
          source "$CM_BUILD_DIR/project.env"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$PROJECT_DIR/local.properties"

      - name: Install Gradle 8.9
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          if [ ! -x "$CM_BUILD_DIR/gradle-8.9/bin/gradle" ]; then
            curl -L --fail --retry 3 -o gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
            rm -rf gradle-8.9
            unzip -q gradle.zip
            rm -f gradle.zip
          fi
          "$CM_BUILD_DIR/gradle-8.9/bin/gradle" --version

      - name: Build BeatNova Release APK
        script: |
          set -euo pipefail
          source "$CM_BUILD_DIR/project.env"
          cd "$PROJECT_DIR"
          "$CM_BUILD_DIR/gradle-8.9/bin/gradle" --no-daemon --stacktrace clean assembleRelease

          echo "APK files:"
          find "$PROJECT_DIR/app/build/outputs/apk" -type f -maxdepth 3 -print | sort

    artifacts:
      - $CM_BUILD_DIR/build_project/**/app/build/outputs/apk/release/*.apk
