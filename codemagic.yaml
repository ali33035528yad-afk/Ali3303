workflows:
  beatnova-android:
    name: BeatNova Android
    max_build_duration: 45
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:

      - name: Find and extract BeatNova ZIP
        script: |
          set -e

          cd "$CM_BUILD_DIR"

          echo "=== Repository files ==="
          ls -lah

          ZIP_FILE="$(find "$CM_BUILD_DIR" -maxdepth 1 -type f -iname 'BeatNova-*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: BeatNova ZIP not found!"
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          rm -rf "$CM_BUILD_DIR/build_project"
          mkdir -p "$CM_BUILD_DIR/build_project"

          unzip -q "$ZIP_FILE" -d "$CM_BUILD_DIR/build_project"

          echo "=== Extracted files ==="
          find "$CM_BUILD_DIR/build_project" -maxdepth 4 -type f | sort

          PROJECT_DIR="$(find "$CM_BUILD_DIR/build_project" \
            -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -print -quit | xargs dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle.kts not found!"
            exit 1
          fi

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle.kts not found!"
            echo "Project directory:"
            echo "$PROJECT_DIR"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" > "$CM_BUILD_DIR/project.env"

          echo "================================"
          echo "Android project found:"
          echo "$PROJECT_DIR"
          echo "================================"

      - name: Check project
        script: |
          set -e

          source "$CM_BUILD_DIR/project.env"

          echo "Checking Android project..."

          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          echo "Project structure OK."

      - name: Configure Android SDK
        script: |
          set -e

          source "$CM_BUILD_DIR/project.env"

          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$PROJECT_DIR/local.properties"

          echo "Android SDK configured."

      - name: Install Gradle
        script: |
          set -e

          cd "$CM_BUILD_DIR"

          if [ ! -x "$CM_BUILD_DIR/gradle-8.9/bin/gradle" ]; then
            echo "Downloading Gradle 8.9..."

            curl -L --fail \
              -o gradle-8.9-bin.zip \
              https://services.gradle.org/distributions/gradle-8.9-bin.zip

            unzip -q gradle-8.9-bin.zip

            rm -f gradle-8.9-bin.zip
          fi

          "$CM_BUILD_DIR/gradle-8.9/bin/gradle" --version

      - name: Build BeatNova
        script: |
          set -e

          source "$CM_BUILD_DIR/project.env"

          cd "$PROJECT_DIR"

          echo "================================"
          echo "Building BeatNova Release APK"
          echo "================================"

          "$CM_BUILD_DIR/gradle-8.9/bin/gradle" \
            --no-daemon \
            --stacktrace \
            clean \
            assembleRelease

      - name: Collect APK
        script: |
          set -e

          source "$CM_BUILD_DIR/project.env"

          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found!"

            find "$PROJECT_DIR/app/build/outputs" \
              -type f 2>/dev/null || true

            exit 1
          fi

          mkdir -p "$CM_BUILD_DIR/artifacts"

          cp "$APK" \
            "$CM_BUILD_DIR/artifacts/BeatNova-release.apk"

          echo "================================"
          echo "APK CREATED SUCCESSFULLY"
          echo "$CM_BUILD_DIR/artifacts/BeatNova-release.apk"
          echo "================================"

    artifacts:
      - artifacts/BeatNova-release.apk
