workflows:
  beatnova-android:
    name: BeatNova Android
    max_build_duration: 45
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:

      - name: Find and extract BeatNova ZIP
        script: |
          set -e

          cd "$CM_BUILD_DIR"

          ZIP_FILE="$(find "$CM_BUILD_DIR" -maxdepth 1 -type f -iname 'BeatNova-*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: BeatNova ZIP not found"
            ls -lah
            exit 1
          fi

          echo "ZIP: $ZIP_FILE"

          rm -rf "$CM_BUILD_DIR/build_project"
          mkdir -p "$CM_BUILD_DIR/build_project"

          unzip -q "$ZIP_FILE" -d "$CM_BUILD_DIR/build_project"

          PROJECT_DIR="$(find "$CM_BUILD_DIR/build_project" \
            -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -print -quit | xargs dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" > "$CM_BUILD_DIR/project.env"

          echo "Project:"
          echo "$PROJECT_DIR"

      - name: Fix Compose source
        script: |
          set -e

          source "$CM_BUILD_DIR/project.env"

          MAIN="$PROJECT_DIR/app/src/main/java/com/beatnova/app/MainActivity.kt"

          if [ ! -f "$MAIN" ]; then
            echo "ERROR: MainActivity.kt not found"
            find "$PROJECT_DIR/app/src/main" -type f
            exit 1
          fi

          echo "Fixing MainActivity.kt..."

          # Fix wrong LocalLayoutDir name
          sed -i.bak 's/LocalLayoutDir/LocalLayoutDirection/g' "$MAIN"

          # Add LocalLayoutDirection import if missing
          if ! grep -q "import androidx.compose.ui.unit.LocalLayoutDirection" "$MAIN"; then
            sed -i.bak '/^import /a import androidx.compose.ui.unit.LocalLayoutDirection' "$MAIN"
          fi

          # Add NavigationBarItem import if missing
          if grep -q "NavigationBarItem" "$MAIN"; then
            if ! grep -q "import androidx.compose.material3.NavigationBarItem" "$MAIN"; then
              sed -i.bak '/^import /a import androidx.compose.material3.NavigationBarItem' "$MAIN"
            fi
          fi

          echo "=== MainActivity imports ==="
          head -n 45 "$MAIN"

      - name: Check project
        script: |
          set -e

          source "$CM_BUILD_DIR/project.env"

          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"

          echo "Project structure OK"

      - name: Configure Android SDK
        script: |
          set -e

          source "$CM_BUILD_DIR/project.env"

          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$PROJECT_DIR/local.properties"

      - name: Install Gradle
        script: |
          set -e

          cd "$CM_BUILD_DIR"

          if [ ! -x "$CM_BUILD_DIR/gradle-8.9/bin/gradle" ]; then
            curl -L --fail \
              -o gradle.zip \
              https://services.gradle.org/distributions/gradle-8.9-bin.zip

            unzip -q gradle.zip
            rm -f gradle.zip
          fi

          "$CM_BUILD_DIR/gradle-8.9/bin/gradle" --version

      - name: Build BeatNova
        script: |
          set -e

          source "$CM_BUILD_DIR/project.env"

          cd "$PROJECT_DIR"

          "$CM_BUILD_DIR/gradle-8.9/bin/gradle" \
            --no-daemon \
            --stacktrace \
            clean \
            assembleRelease

      - name: Collect APK
        script: |
          set -e

          source "$CM_BUILD_DIR/project.env"

          APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found"
            find "$PROJECT_DIR/app/build/outputs" -type f 2>/dev/null || true
            exit 1
          fi

          mkdir -p "$CM_BUILD_DIR/artifacts"

          cp "$APK" "$CM_BUILD_DIR/artifacts/BeatNova-release.apk"

          echo "APK READY"

    artifacts:
      - artifacts/BeatNova-release.apk
