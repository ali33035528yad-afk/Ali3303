workflows:
  beatnova-android:
    name: BeatNova Android
    max_build_duration: 45

    environment:
      java: 17

    scripts:

      - name: Find and extract BeatNova ZIP
        script: |
          set -e

          echo "======================================"
          echo "Finding BeatNova ZIP..."
          echo "======================================"

          ZIP_FILE="$(find "$CM_BUILD_DIR" -maxdepth 2 -type f -name 'BeatNova-OnlinePlayer-Release-Codemagic-Fixed2.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE="$(find "$CM_BUILD_DIR" -maxdepth 2 -type f -name 'BeatNova-*.zip' -print -quit)"
          fi

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: BeatNova ZIP was not found."
            echo "Repository files:"
            find "$CM_BUILD_DIR" -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          rm -rf "$CM_BUILD_DIR/build_project"
          mkdir -p "$CM_BUILD_DIR/build_project"

          unzip -q "$ZIP_FILE" -d "$CM_BUILD_DIR/build_project"

          PROJECT_DIR="$(find "$CM_BUILD_DIR/build_project" \
            -type f \
            \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) \
            -print -quit)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: settings.gradle(.kts) not found."
            find "$CM_BUILD_DIR/build_project" -maxdepth 6 -type f | sort
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_DIR")"

          echo "PROJECT_DIR=$PROJECT_DIR"

          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle.kts not found."
            find "$PROJECT_DIR" -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" > "$CM_BUILD_DIR/project.env"

      - name: Check project
        script: |
          set -e

          source "$CM_BUILD_DIR/project.env"

          echo "Checking Android project..."
          echo "Project: $PROJECT_DIR"

          test -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/build.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          echo "Project files OK."

      - name: Configure Android SDK
        script: |
          set -e

          source "$CM_BUILD_DIR/project.env"

          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$PROJECT_DIR/local.properties"

          echo "Android SDK:"
          echo "$ANDROID_SDK_ROOT"

      - name: Prepare Gradle
        script: |
          set -e

          source "$CM_BUILD_DIR/project.env"

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Gradle wrapper found."
          else
            echo "Gradle wrapper not found."
            echo "Installing Gradle 8.9..."

            cd "$CM_BUILD_DIR"

            curl -L --fail \
              -o gradle.zip \
              https://services.gradle.org/distributions/gradle-8.9-bin.zip

            rm -rf gradle-8.9

            unzip -q gradle.zip
            rm -f gradle.zip

            echo "Gradle installed."
          fi

      - name: Build BeatNova
        script: |
          set -e

          source "$CM_BUILD_DIR/project.env"

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "Building BeatNova Release APK"
          echo "======================================"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew

            ./gradlew \
              --no-daemon \
              --stacktrace \
              clean \
              assembleRelease
          else
            "$CM_BUILD_DIR/gradle-8.9/bin/gradle" \
              --no-daemon \
              --stacktrace \
              clean \
              assembleRelease
          fi

      - name: Collect APK
        script: |
          set -e

          source "$CM_BUILD_DIR/project.env"

          echo "Searching for APK..."

          APK="$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name '*.apk' \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."

            if [ -d "$PROJECT_DIR/app/build/outputs" ]; then
              find "$PROJECT_DIR/app/build/outputs" -type f | sort
            fi

            exit 1
          fi

          mkdir -p "$CM_BUILD_DIR/artifacts"

          cp "$APK" \
            "$CM_BUILD_DIR/artifacts/BeatNova-release.apk"

          echo "======================================"
          echo "APK READY"
          echo "$CM_BUILD_DIR/artifacts/BeatNova-release.apk"
          echo "======================================"

    artifacts:
      - artifacts/BeatNova-release.apk
      - "**/app/build/outputs/**/*.apk"
