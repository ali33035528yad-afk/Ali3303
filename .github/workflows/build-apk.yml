name: BeatNova Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: beatnova-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  ANDROID_API: '35'
  BUILD_TOOLS: '35.0.0'
  GRADLE_VERSION: '8.9'

jobs:
  build-apk:
    name: Build Signed Release APK + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-${ANDROID_API}" "build-tools;${BUILD_TOOLS}"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - name: Prepare persistent release signing
        env:
          KEYSTORE_B64: ${{ secrets.BEATNOVA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BEATNOVA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BEATNOVA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BEATNOVA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/beatnova-release.jks"
          if [ -n "${KEYSTORE_B64:-}" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
            test -s "$KEYSTORE"
          else
            keytool -genkeypair -v -keystore "$KEYSTORE" -storepass beatnova -alias beatnova -keypass beatnova -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=BeatNova, O=BeatNova, C=US"
            KEYSTORE_PASSWORD=beatnova
            KEY_ALIAS=beatnova
            KEY_PASSWORD=beatnova
          fi
          echo "CM_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "CM_KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD:-beatnova}" >> "$GITHUB_ENV"
          echo "CM_KEY_ALIAS=${KEY_ALIAS:-beatnova}" >> "$GITHUB_ENV"
          echo "CM_KEY_PASSWORD=${KEY_PASSWORD:-beatnova}" >> "$GITHUB_ENV"
      - name: Apply Supabase auth recovery patch
        run: python scripts/patch-auth-recovery.py
      - name: Apply offline downloads and library patch
        run: python scripts/patch-offline-downloads.py
      - name: Apply ads architecture and About section patch
        run: python scripts/patch-ads-about.py
      - name: Replace native ad placeholder with Adivery banner
        run: python scripts/patch-native-ad.py
      - name: Apply BeatNova full player screen
        run: python scripts/patch-full-player.py
      - name: Apply Adivery interstitial and app-open ads
        run: python scripts/patch-fullscreen-ads-v2.py
      - name: Apply unique artwork to songs
        run: python scripts/patch-song-artwork.py
      - name: Apply BeatNova Design 2
        run: python scripts/patch-design2.py
      - name: Fix notification compatibility
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/beatnova/app/MainActivity.kt')
          s = p.read_text()
          old = '.setStyle(NotificationCompat.MediaStyle().setShowActionsInCompactView(0))'
          if old in s:
              p.write_text(s.replace(old, ''))
          PY
      - name: Build Release APK and App Bundle
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ADIVERY_APP_ID: ${{ secrets.ADIVERY_APP_ID }}
          ADIVERY_BANNER_PLACEMENT_ID: ${{ secrets.ADIVERY_BANNER_PLACEMENT_ID }}
          ADIVERY_INTERSTITIAL_PLACEMENT_ID: ${{ secrets.ADIVERY_INTERSTITIAL_PLACEMENT_ID }}
          ADIVERY_APP_OPEN_PLACEMENT_ID: ${{ secrets.ADIVERY_APP_OPEN_PLACEMENT_ID }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace clean assembleRelease bundleRelease
      - name: Verify APK is signed and installable
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK"
          test -s "$AAB"
          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner" verify --print-certs "$APK"
          sha256sum "$APK" "$AAB"
      - name: Rename release APK
        run: cp app/build/outputs/apk/release/app-release.apk "BeatNova-release-myket-v2.apk"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeatNova-release-apk-${{ github.run_number }}
          path: BeatNova-release-myket-v2.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeatNova-release-aab-${{ github.run_number }}
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: beatnova-build-${{ github.run_number }}
          name: BeatNova build ${{ github.run_number }}
          generate_release_notes: true
          prerelease: true
          files: |
            BeatNova-release-myket-v2.apk
            app/build/outputs/bundle/release/app-release.aab

# Trigger a fresh signed build after the APK signing fix.
