name: Android APK Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Apply per-song artwork
        run: python3 scripts/patch-song-artwork.py

      - name: Apply BeatNova Design 2
        run: python3 scripts/patch-design2.py

      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BeatNova-design2-debug-apk
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
